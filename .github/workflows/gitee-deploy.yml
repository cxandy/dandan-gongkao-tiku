name: Deploy to Gitee Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GITEE_USERNAME: 'cxandy'
  GITEE_NAMESPACE: cxandy
  GITEE_REPO: gongkao-tiku

permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repo to Gitee main branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git push -f "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_NAMESPACE}/${GITEE_REPO}.git" main:main

      - name: Rebuild Gitee Pages
        uses: yanglbme/gitee-pages-action@main
        with:
          gitee-username: ${{ env.GITEE_USERNAME }}
          gitee-password: ${{ secrets.GITEE_PASSWORD }}
          gitee-repo: ${{ env.GITEE_NAMESPACE }}/${{ env.GITEE_REPO }}
          branch: main
          https: 'true'