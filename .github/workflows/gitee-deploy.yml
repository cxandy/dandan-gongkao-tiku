name: Deploy to Gitee Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - run: npm install
      - run: npm run build
      
      - name: Deploy to Gitee Pages
        uses: JamesTider/Publish-to-Gitee-Pages@master
        with:
          token: ${{ secrets.GITEE_TOKEN }}
          path: ./dist